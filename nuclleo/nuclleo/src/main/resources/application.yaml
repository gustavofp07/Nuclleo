spring:
  application:
    name: nuclleo

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param

integrations:
  arquivos:
    base-url: ${ARQUIVOS_API_URL:https://gerenciador-arquivos-7q58.onrender.com}

jwt:
  # Em produção, defina a variável de ambiente JWT_SECRET; o valor depois do ":" é só para rodar local
  secret: ${JWT_SECRET:nuclleo-chave-secreta-com-pelo-menos-32-caracteres}
  expiration: 86400000