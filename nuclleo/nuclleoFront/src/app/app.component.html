<!-- app.component.html -->

<ion-app>

  <ion-menu contentId="main-content" [disabled]="!menuHabilitado">

    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list>

        <ion-item button routerLink="/tela-inicial" menuClose>
          <ion-icon name="home-outline" slot="start"></ion-icon>
          <ion-label>Início</ion-label>
        </ion-item>

        <ion-accordion-group>
          <ion-accordion value="anunciar">

            <ion-item slot="header">
              <ion-icon name="megaphone-outline" slot="start"></ion-icon>
              <ion-label>Meus anúncios</ion-label>
            </ion-item>

            <div slot="content">
              <ion-item button routerLink="/anuncio-meus/venda" menuClose>
                <ion-icon name="pricetag-outline" slot="start"></ion-icon>
                <ion-label>Vender</ion-label>
              </ion-item>

              <ion-item button routerLink="/anuncio-meus/compra" menuClose>
                <ion-icon name="cart-outline" slot="start"></ion-icon>
                <ion-label>Comprar</ion-label>
              </ion-item>
            </div>

          </ion-accordion>
        </ion-accordion-group>

        <ion-item button routerLink="/minhas-comunidades" menuClose>
          <ion-icon name="people-outline" slot="start"></ion-icon>
          <ion-label>Comunidades</ion-label>
        </ion-item>

        <ion-item button routerLink="/conversas" menuClose>
          <ion-icon name="chatbubble-outline" slot="start"></ion-icon>
          <ion-label>Conversas</ion-label>
        </ion-item>

        <ion-item button routerLink="/interesse" menuClose>
          <ion-icon name="heart-outline" slot="start"></ion-icon>
          <ion-label>Interesses</ion-label>
          <ion-badge *ngIf="totalInteressesRecebidos > 0" class="badge-menu" slot="end">
            {{ totalInteressesRecebidos }}
          </ion-badge>
        </ion-item>

        <ion-item button routerLink="/usuario-perfil" menuClose>
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-label>Perfil</ion-label>
        </ion-item>

        <ion-item button routerLink="/login" menuClose>
          <ion-icon name="log-out-outline" slot="start"></ion-icon>
          <ion-label>Sair</ion-label>
        </ion-item>

      </ion-list>
    </ion-content>

  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>

</ion-app>
