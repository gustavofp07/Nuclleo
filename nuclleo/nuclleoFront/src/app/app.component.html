<!-- app.component.html -->

<ion-app>

  <ion-menu contentId="main-content" [disabled]="!menuHabilitado">

    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list>

        <ion-item button routerLink="/tela-inicial" menuClose>

          <ion-icon name="home-outline" slot="start">
          </ion-icon>

          <ion-label>Início</ion-label>

        </ion-item>


        <ion-item button routerLink="/usuario-perfil" menuClose>

          <ion-icon name="person-outline" slot="start">
          </ion-icon>

          <ion-label>Perfil</ion-label>

        </ion-item>

        <ion-item button routerLink="/minhas-comunidades" menuClose>

          <ion-icon name="people-outline" slot="start">
          </ion-icon>

          <ion-label>Minhas comunidades</ion-label>

        </ion-item>

        <ion-item button routerLink="/login" menuClose>

          <ion-icon name="log-out-outline" slot="start">
          </ion-icon>

          <ion-label>Sair</ion-label>

        </ion-item>
        
      </ion-list>
    </ion-content>

  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>

</ion-app>
