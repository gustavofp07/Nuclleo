<ion-app>

  <ion-menu contentId="main-content" [disabled]="!menuHabilitado">

    <ion-content class="menu-content">

      <div class="menu-brand">
        <img src="assets/img/logo.png" alt="Nuclleo" class="menu-brand__logo">
        <div class="menu-brand__texto">
          <span class="menu-brand__nome text-gradient">Nuclleo</span>
          <span class="menu-brand__usuario" *ngIf="token.nmUsuario">{{ token.nmUsuario }}</span>
        </div>
      </div>

      <p class="section-title menu-secao">Navegação</p>

      <ion-list lines="none" class="menu-lista">

        <ion-item button [detail]="false" routerLink="/tela-inicial" routerLinkActive="ativo" menuClose>
          <ion-icon name="home-outline" slot="start"></ion-icon>
          <ion-label>Início</ion-label>
        </ion-item>

        <ion-accordion-group>
          <ion-accordion value="anunciar" toggleIconSlot="end">

            <ion-item slot="header" [detail]="false">
              <ion-icon name="megaphone-outline" slot="start"></ion-icon>
              <ion-label>Meus anúncios</ion-label>
            </ion-item>

            <div slot="content" class="menu-sublista">
              <ion-item button [detail]="false" routerLink="/anuncio-meus/venda" routerLinkActive="ativo" menuClose>
                <ion-icon name="pricetag-outline" slot="start"></ion-icon>
                <ion-label>Vender</ion-label>
              </ion-item>

              <ion-item button [detail]="false" routerLink="/anuncio-meus/compra" routerLinkActive="ativo" menuClose>
                <ion-icon name="cart-outline" slot="start"></ion-icon>
                <ion-label>Comprar</ion-label>
              </ion-item>
            </div>

          </ion-accordion>
        </ion-accordion-group>

        <ion-item button [detail]="false" routerLink="/minhas-comunidades" routerLinkActive="ativo" menuClose>
          <ion-icon name="people-outline" slot="start"></ion-icon>
          <ion-label>Comunidades</ion-label>
        </ion-item>

        <ion-item button [detail]="false" routerLink="/conversas" routerLinkActive="ativo" menuClose>
          <ion-icon name="chatbubble-outline" slot="start"></ion-icon>
          <ion-label>Conversas</ion-label>
          <span *ngIf="totalConversasPendentes > 0" class="badge badge--gradient" slot="end">
            {{ totalConversasPendentes }}
          </span>
        </ion-item>

        <ion-item button [detail]="false" routerLink="/interesse" routerLinkActive="ativo" menuClose>
          <ion-icon name="heart-outline" slot="start"></ion-icon>
          <ion-label>Interesses</ion-label>
        </ion-item>

        <ion-item button [detail]="false" routerLink="/usuario-perfil" routerLinkActive="ativo"
          [routerLinkActiveOptions]="{ exact: true }" menuClose>
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-label>Perfil</ion-label>
        </ion-item>

        <ion-item button [detail]="false" routerLink="/configuracoes" routerLinkActive="ativo" menuClose>
          <ion-icon name="settings-outline" slot="start"></ion-icon>
          <ion-label>Configurações</ion-label>
        </ion-item>

      </ion-list>

      <div class="menu-rodape">
        <ion-item button [detail]="false" lines="none" routerLink="/login" menuClose class="menu-sair">
          <ion-icon name="log-out-outline" slot="start"></ion-icon>
          <ion-label>Sair</ion-label>
        </ion-item>
      </div>

    </ion-content>

  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>

</ion-app>
