<ion-content [fullscreen]="true" class="login-content">

  <div class="container">

    <!-- Logo / Nome -->
    <div class="brand">
      <h2>Nuclleo</h2>
    </div>

    <!-- Títulos -->
    <div class="copy">
      <h1>Login</h1>
      <p>Insira seu e-mail e senha</p>
    </div>

    <!-- Formulário -->
    <form (ngSubmit)="onSubmit()">

      <!-- Email -->
      <ion-item lines="none" class="input-item">
        <ion-input
          type="email"
          placeholder="E-mail"
          [(ngModel)]="email"
          name="email"
          required>
        </ion-input>
      </ion-item>

      <!-- Senha -->
      <ion-item lines="none" class="input-item">

        <ion-input
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Senha"
          [(ngModel)]="password"
          name="password"
          required>
        </ion-input>

        <ion-button
          fill="clear"
          slot="end"
          type="button"
          (click)="togglePassword()">

          <ion-icon
            [name]="showPassword ? 'eye-off-outline' : 'eye-outline'">
          </ion-icon>

        </ion-button>

      </ion-item>

      <!-- Botão Login -->
      <ion-button
        expand="block"
        type="submit"
        class="btn-login">

        Entrar

      </ion-button>

    </form>

    <!-- Divider -->
    <div class="divider">
      <div class="divider-line"></div>
      <span>ou</span>
      <div class="divider-line"></div>
    </div>

    <!-- Google -->
    <ion-button
      expand="block"
      fill="solid"
      class="btn-google"
      (click)="onGoogleLogin()">

      Continuar com Google

    </ion-button>

    <!-- Cadastro -->
    <a routerLink="/register" class="register-link">
      Não possuo uma conta
    </a>

  </div>

</ion-content>
