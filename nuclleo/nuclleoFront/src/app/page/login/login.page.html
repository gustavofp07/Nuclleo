<ion-content [fullscreen]="true">

  <div class="login-screen">

    <!-- Brand -->
    <div class="brand">
      <h2 class="">Nuclleo</h2>
    </div>

    <!-- Content -->
    <div class="content">

      <!-- Copy -->
      <div class="copy">
        <h1 class="login-title">Login</h1>
        <p class="login-subtitle">Insira seu e-mail e senha</p>
      </div>

      <!-- Email -->
      <ion-item class="field" lines="none">
        <ion-input
          type="email"
          placeholder="E-mail"
          [value]="email()"
          (ionInput)="email.set($any($event.target).value)"
          autocomplete="email">
        </ion-input>
      </ion-item>

      <!-- Senha -->
      <ion-item class="field" lines="none">

        <ion-input
          [type]="showPassword() ? 'text' : 'password'"
          placeholder="Senha"
          [value]="password()"
          (ionInput)="password.set($any($event.target).value)"
          autocomplete="current-password">
        </ion-input>

        <button
          type="button"
          class="toggle-password"
          (click)="showPassword.set(!showPassword())">

          @if (showPassword()) {
            <ion-icon name="eye-off-outline"></ion-icon>
          } @else {
            <ion-icon name="eye-outline"></ion-icon>
          }

        </button>

      </ion-item>

      <!-- Login -->
      <div class="actions">
        <ion-button expand="block" class="btn-primary" (click)="onSubmit()">
          Entrar
        </ion-button>
      </div>

      <!-- Divider -->
      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">ou</span>
        <div class="divider-line"></div>
      </div>

      <!-- Google -->
      <div class="social-buttons">

        <ion-button
          expand="block"
          fill="clear"
          class="btn-google"
          (click)="onGoogleLogin()">

          Continuar com Google

        </ion-button>

      </div>

      <!-- Registro -->
      <a routerLink="/register" class="register-link">
        Não possuo uma conta
      </a>

    </div>

  </div>

</ion-content>
