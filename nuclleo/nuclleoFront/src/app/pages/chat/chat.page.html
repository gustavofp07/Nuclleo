<ion-header>
  <ion-toolbar class="toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/interesse-meus" text=""></ion-back-button>
    </ion-buttons>

    <div class="header-info">
      <div class="avatar">{{ nomeOutroUsuario.charAt(0) }}</div>
      <div class="header-texto">
        <span class="header-nome">{{ nomeOutroUsuario || 'Chat' }}</span>
        <span class="header-status">
          <span class="status-dot" [class.online]="conectado"></span>
          {{ conectado ? 'Online' : 'Conectando...' }}
        </span>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content #content [fullscreen]="true" class="chat-content">

  <div class="chat-wrapper">

    <div class="lista-mensagens">

      <div *ngFor="let mensagem of mensagens" class="mensagem-linha" [class.minha]="ehMinhaMensagem(mensagem)">
        <div class="balao" [class.enviando]="mensagem.enviando">
          <span class="conteudo">{{ mensagem.conteudo }}</span>
          <span class="horario" *ngIf="!mensagem.enviando">{{ mensagem.dataEnvio | date: 'HH:mm' }}</span>
          <span class="dots-enviando" *ngIf="mensagem.enviando">
            <span></span><span></span><span></span>
          </span>
        </div>
      </div>

      <div *ngIf="outroUsuarioDigitando" class="mensagem-linha typing-indicator">
        <div class="balao">
          <span class="dots-typing">
            <span></span><span></span><span></span>
          </span>
        </div>
      </div>

      <div *ngIf="mensagens.length === 0" class="empty-chat">
        <ion-icon name="chatbubble-outline"></ion-icon>
        <p>Nenhuma mensagem ainda. Diga oi!</p>
      </div>

    </div>

  </div>

</ion-content>

<ion-footer>
  <div class="footer-bar">
    <div class="footer-wrapper">
      <div class="input-item" [class.com-contador]="textoMensagem.length > 400">
        <ion-input [(ngModel)]="textoMensagem" placeholder="Digite sua mensagem..." maxlength="500"
          (ionInput)="onDigitar()" (keyup.enter)="enviar()">
        </ion-input>

        <ion-button fill="clear" class="btn-enviar" (click)="enviar()">
          <ion-icon name="send-outline"></ion-icon>
        </ion-button>

        <span class="contador-caracteres" *ngIf="textoMensagem.length > 400"
          [class.limite]="textoMensagem.length >= 500">
          {{ textoMensagem.length }}/500
        </span>
      </div>

    </div>
  </div>
</ion-footer>
