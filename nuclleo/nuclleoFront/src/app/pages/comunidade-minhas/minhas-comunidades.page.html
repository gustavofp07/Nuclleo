<div class="ion-page" id="main-content">

  <!-- HEADER -->
  <ion-header>
    <ion-toolbar class="toolbar">

      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>

      <ion-title>Minhas comunidades</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- CONTEUDO -->
  <ion-content [fullscreen]="true" class="comunidades-content">

    <div class="container">
      <!-- TOPO -->
      <div class="topo">
        <h1>Suas comunidades</h1>
        <p>Veja as comunidades que você participa e gerencie as que você criou</p>
      </div>

      <!-- BOTAO -->
      <ion-button expand="block" class="btn-criar" routerLink="/criar-comunidade">Criar uma comunidade</ion-button>

      <!-- CARREGANDO -->
      <div class="loading-state" *ngIf="carregando">
        <ion-spinner name="crescent"></ion-spinner>
        <p>Carregando...</p>
      </div>

      <!-- LISTA -->
      <div class="lista-comunidades" *ngIf="!carregando && comunidades.length > 0">
        <button class="comunidade-card" type="button" *ngFor="let comunidade of comunidades"
          [routerLink]="['/comunidade-tela', comunidade.cdComunidade]">

          <img [src]="comunidade.foto || 'https://picsum.photos/200'" class="foto-comunidade">

          <div class="info">
            <div class="titulo-comunidade">
              <h2>{{ comunidade.nmComunidade }}</h2>
              <span class="admin-badge" *ngIf="usuarioEhAdmin(comunidade)">ADMIN</span>
              <span class="membro-badge" *ngIf="!usuarioEhAdmin(comunidade)">MEMBRO</span>
            </div>
            <p>{{ comunidade.descricao }}</p>
            <p>{{ comunidade.cep }}</p>
            <p>{{ comunidade.cidade }}, {{ comunidade.uf }} </p>
            <p>{{ comunidade.dtCriacao | date:'dd/MM/yyyy' }}</p>
          </div>

        </button>
      </div>

      <!-- VAZIO -->
      <div class="empty-state" *ngIf="!carregando && comunidades.length === 0">

        <ion-icon name="people-outline"></ion-icon>

        <h2>Nenhuma comunidade encontrada</h2>

        <p>
          Entre em uma comunidade ou crie a sua primeira.
        </p>

      </div>
    </div>

  </ion-content>
</div>
