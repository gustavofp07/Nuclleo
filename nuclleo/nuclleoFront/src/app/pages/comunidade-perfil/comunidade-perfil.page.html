<ion-header>

  <ion-toolbar class="toolbar">

    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-title>Comunidade</ion-title>

  </ion-toolbar>

</ion-header>

<ion-content [fullscreen]="true" class="perfil-content">

  <div class="container">

    <!-- TOPO -->

    <div class="perfil-topo">

      <img
        [src]="comunidade.foto || 'assets/img/comunidadePadrao.png'"
        class="foto-comunidade">

      <div class="dados-comunidade">

        <h2>{{ comunidade.nmComunidade }}</h2>

        <p>Comunidade da Nuclleo</p>

      </div>

    </div>

    <!-- DESCRIÇÃO -->

    <div class="info-box">

      <h3>Descrição</h3>

      <p>
        {{ comunidade.descricao }}
      </p>

    </div>

    <!-- INFORMAÇÕES -->

    <div class="info-box">

      <div class="info-item">

        <ion-icon name="calendar-outline"></ion-icon>

        <span>
          Criada em {{ comunidade.dtCriacao | date:'dd/MM/yyyy' }}
        </span>

      </div>

      <div class="info-item">

        <ion-icon name="person-outline"></ion-icon>

        <span>
          Criada por {{ comunidade.usuarioCria.nmUsuario }}
        </span>

      </div>

    </div>

    <!-- BOTÃO ENTRAR -->

    <div class="acoes-comunidade">

      <ion-button
        expand="block"
        class="btn-entrar"
        (click)="entrarComunidade()">

        <ion-icon
          name="people-outline"
          slot="start">
        </ion-icon>

        Entrar

      </ion-button>

    </div>

  </div>

</ion-content>
