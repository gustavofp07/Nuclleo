<ion-content [fullscreen]="true" class="criar-content">

  <div class="container">

    <!-- LOGO -->
    <div class="brand">

      <img
        src="assets/img/logo.png"
        alt="Logo Nuclleo"
        class="logo">

    </div>

    <!-- TOPO -->
    <div class="topo">

      <h1>Criar comunidade</h1>

      <p>
        Preencha as informações abaixo
      </p>

    </div>

    <!-- FORM -->
    <form (ngSubmit)="criarComunidade()">

      <!-- NOME -->
      <ion-item lines="none" class="input-item">

        <ion-input
          placeholder="Nome da comunidade"
          [(ngModel)]="comunidade.nmComunidade"
          name="nmComunidade">
        </ion-input>

      </ion-item>

      <!-- DESCRIÇÃO -->
      <ion-item lines="none" class="input-item">

        <ion-input
          placeholder="Descrição"
          [(ngModel)]="comunidade.descricao"
          name="descricao">
        </ion-input>

      </ion-item>

      <!-- FOTO -->
      <ion-item lines="none" class="input-item">

        <ion-input
          placeholder="URL da foto"
          [(ngModel)]="comunidade.foto"
          name="foto">
        </ion-input>

      </ion-item>

      <!-- BOTÃO -->
      <ion-button
        expand="block"
        type="submit"
        class="btn-criar">

        Criar comunidade

      </ion-button>

    </form>

  </div>

</ion-content>
