<div class="ion-page" id="main-content">

  <ion-header>
    <ion-toolbar class="toolbar">
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-title>Meus interesses</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content [fullscreen]="true" class="interesses-content">

    <div class="container">

      <div class="topo">
        <h1>Meus interesses</h1>
        <p>Anúncios em que você manifestou interesse</p>
      </div>

      <div class="lista-interesses" *ngIf="interesses.length > 0">
        <div class="interesse-card" *ngFor="let interesse of interesses">

          <a class="info" [routerLink]="['/anuncio-tela', interesse.anuncio.cdAnuncio]">
            <h2>{{ interesse.anuncio.nmAnuncio }}</h2>
            <p class="descricao">{{ interesse.anuncio.descricao }}</p>
          </a>

          <div class="anuncio-imagem">
            <div class="anuncio-imagem-placeholder"></div>
          </div>

          <ion-button fill="clear" color="danger" class="btn-remover"
            (click)="confirmarRemocao(interesse)">
            <ion-icon name="trash-outline"></ion-icon>
          </ion-button>

        </div>
      </div>

      <div class="empty-state" *ngIf="interesses.length === 0">
        <ion-icon name="heart-outline"></ion-icon>
        <h2>Nenhum interesse registrado</h2>
        <p>Quando você demonstrar interesse em um anúncio, ele vai aparecer aqui.</p>
      </div>

    </div>

  </ion-content>
</div>
