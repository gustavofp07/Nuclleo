<div class="ion-page" id="main-content">

  <!-- HEADER -->
  <ion-header>
    <ion-toolbar class="toolbar">

      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>

      <ion-title>Minhas comunidades</ion-title>

    </ion-toolbar>
  </ion-header>

  <!-- CONTEÚDO -->
  <ion-content [fullscreen]="true" class="comunidades-content">

    <div class="container">

      <!-- TOPO -->
      <div class="topo">

        <h1>Suas comunidades</h1>

        <p>
          Gerencie as comunidades criadas por você
        </p>

      </div>

      <!-- LISTA -->
      <div class="lista-comunidades" *ngIf="comunidades.length > 0">

        <div class="comunidade-card" *ngFor="let comunidade of comunidades">

          <<img [src]="
    comunidade.foto ||
    'https://picsum.photos/200'
  " class="foto-comunidade">

            <div class="info">

              <h2>{{ comunidade.nmComunidade }}</h2>

              <p>{{ comunidade.descricao }}</p>

            </div>

        </div>

      </div>

      <!-- VAZIO -->
      <div class="empty-state" *ngIf="comunidades.length === 0">

        <ion-icon name="people-outline"></ion-icon>

        <h2>Nenhuma comunidade criada</h2>

        <p>
          Crie sua primeira comunidade e comece
          a conectar pessoas.
        </p>

      </div>

      <!-- BOTÃO -->
      <ion-button expand="block" class="btn-criar" routerLink="/criar-comunidade">

        Criar comunidade

      </ion-button>

    </div>

  </ion-content>

</div>
