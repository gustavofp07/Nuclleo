<div class="ion-page" id="main-content">

  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>

      <ion-title>Nuclleo</ion-title>

    </ion-toolbar>
  </ion-header>

  <!-- Botoes -->
  <ion-content [fullscreen]="true">

    <div class="section">

      <div class="section">
        <ion-searchbar placeholder="Pesquisar comunidades" [(ngModel)]="pesquisa"
          (ionInput)="aoPesquisar($event)">
        </ion-searchbar>
      </div>

      <div class="opcao-proximidade">
        <span>Comunidades próximas</span>
        <ion-toggle [(ngModel)]="buscarPorProximidade" (ionChange)="alterarBuscaProximidade()">
        </ion-toggle>
      </div>

      <!-- CARREGANDO -->
      <div class="loading-state" *ngIf="carregandoComunidades">
        <ion-spinner name="crescent"></ion-spinner>
        <p>Carregando...</p>
      </div>

      <ion-list *ngIf="!carregandoComunidades">

        <ion-item *ngFor="let comunidade of comunidades" button detail="true"
          [routerLink]="['/comunidade-tela', comunidade.cdComunidade]">

          <ion-avatar slot="start">
            <img [src]="comunidade.foto || 'assets/img/comunidadePadrao.png'" alt="Foto da Comunidade">
          </ion-avatar>

          <ion-label>
            <h3>{{ comunidade.nmComunidade }}</h3>
            <p class="descricao-clamp">{{ comunidade.descricao }}</p>
            <p>{{ comunidade.cidade }}, {{ comunidade.uf }}</p>
            <p>{{ comunidade.cep }}</p>
          </ion-label>
        </ion-item>

      </ion-list>
    </div>

  </ion-content>
</div>
