<div class="ion-page" id="main-content">

  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>

      <ion-title>Nuclleo</ion-title>

    </ion-toolbar>
  </ion-header>

  <ion-content [fullscreen]="true">

    <div class="section">

      <ion-searchbar placeholder="Pesquisar comunidades" [(ngModel)]="pesquisa" (ionInput)="aoPesquisar($event)">
      </ion-searchbar>

      <div class="opcao-proximidade">
        <span>Mostrar comunidades próximas</span>
        <ion-toggle [(ngModel)]="buscarPorProximidade" [disabled]="verificandoCep"
          (ionChange)="alterarBuscaProximidade()">
        </ion-toggle>
      </div>

      <!-- CARREGANDO -->
      <div class="loading-state" *ngIf="carregandoComunidades">
        <ion-spinner name="crescent"></ion-spinner>
        <p>Carregando...</p>
      </div>

      <div class="comunidades-grid" *ngIf="!carregandoComunidades">

        <div class="comunidade-card" *ngFor="let comunidade of comunidades"
          [routerLink]="['/comunidade-tela', comunidade.cdComunidade]">

          <img [src]="comunidade.foto || 'assets/img/comunidadePadrao.png'" class="foto-comunidade">

          <div class="info">

            <!-- TÍTULO -->
            <div class="titulo-comunidade">
              <h2>{{ comunidade.nmComunidade }}</h2>
            </div>

            <!-- DESCRIÇÃO -->
            <p class="descricao-comunidade">
              {{ comunidade.descricao }}
            </p>

            <!-- INFORMAÇÕES -->
            <div class="comunidade-detalhes">

              <span>
                <ion-icon name="location-outline"></ion-icon>
                {{ comunidade.cidade }}, {{ comunidade.uf }}
              </span>

              <span>
                <ion-icon name="calendar-outline"></ion-icon>
                Criada em {{ comunidade.dtCriacao | date:'dd/MM/yyyy' }}
              </span>

            </div>

          </div>

        </div>

      </div>

    </div>

  </ion-content>
</div>
