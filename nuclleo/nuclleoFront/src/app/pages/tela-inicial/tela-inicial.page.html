<div class="ion-page" id="main-content">

  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>

      <ion-title>Nuclleo</ion-title>

    </ion-toolbar>
  </ion-header>

  <!-- Botoes -->
  <ion-content [fullscreen]="true">

    <div class="acoes-rapidas">

      <ion-button expand="block" class="btn-venda" routerLink="/criar-anuncio/venda">
        Criar anúncio de venda
      </ion-button>

      <ion-button expand="block" fill="outline" class="btn-requerimento" routerLink="/criar-anuncio/requerimento">
        Criar requerimento
      </ion-button>

    </div>

    <div class="section">
      <h2>Sugestões para você</h2>

      <div class="horizontal-scroll">

        <ion-card *ngFor="let anuncio of anunciosRecomendados" class="product-card"
          [routerLink]="['/anuncio-tela', anuncio.cdAnuncio]">

          <img src="https://picsum.photos/300/200">

          <ion-card-header>
            <ion-card-title>
              {{ anuncio.nmAnuncio }}
            </ion-card-title>

            <ion-card-subtitle>
              {{ anuncio.tipoAnuncio }}
            </ion-card-subtitle>
          </ion-card-header>

        </ion-card>

      </div>
    </div>

    <div class="section">
      <h2>Comunidades</h2>
      <ion-list>

        <ion-item *ngFor="let comunidade of comunidades" button detail="true"
          [routerLink]="['/comunidade-tela', comunidade.cdComunidade]">

          <ion-avatar slot="start">
            <img [src]="comunidade.foto || 'https://ionicframework.com/docs/img/demos/avatar.svg'">
          </ion-avatar>

          <ion-label>
            <h3>{{ comunidade.nmComunidade }}</h3>
            <p>{{ comunidade.descricao }}</p>
          </ion-label>
        </ion-item>

      </ion-list>
    </div>

  </ion-content>
</div>
