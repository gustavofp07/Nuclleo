<div class="ion-page" id="main-content">

  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>

      <ion-title>Nuclleo</ion-title>

    </ion-toolbar>
  </ion-header>

  <!-- Botoes -->
  <ion-content [fullscreen]="true">

    <div class="section">
      <h2>Sugestões para você</h2>

      <div class="horizontal-scroll">

        <ion-card *ngFor="let anuncio of anunciosRecomendados" class="product-card"
          [routerLink]="['/anuncio-tela', anuncio.cdAnuncio]">

          <img *ngIf="anuncio.ftAnuncio" [src]="anuncio.ftAnuncio" class="foto-produto">
          <div *ngIf="!anuncio.ftAnuncio" class="foto-produto-placeholder">
            <ion-icon name="image-outline"></ion-icon>
          </div>
          
          <ion-card-header>
            <ion-card-title class="titulo-clamp">
              {{ anuncio.nmAnuncio | slice:0:25 }}{{ anuncio.nmAnuncio.length > 25 ? '...' : '' }}
            </ion-card-title>

            <ion-card-subtitle>
              {{ anuncio.tipoAnuncio }}
            </ion-card-subtitle>
          </ion-card-header>

        </ion-card>

      </div>
    </div>

    <div class="section">
      <h2>Comunidades</h2>
      <ion-list>

        <ion-item *ngFor="let comunidade of comunidades" button detail="true"
          [routerLink]="['/comunidade-tela', comunidade.cdComunidade]">

          <ion-avatar slot="start">
            <img [src]="comunidade.foto || 'https://ionicframework.com/docs/img/demos/avatar.svg'">
          </ion-avatar>

          <ion-label>
            <h3>{{ comunidade.nmComunidade }}</h3>
            <p class="descricao-clamp">{{ comunidade.descricao }}</p>
          </ion-label>
        </ion-item>

      </ion-list>
    </div>

  </ion-content>
</div>
