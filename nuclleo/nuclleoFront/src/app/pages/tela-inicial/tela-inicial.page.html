<div class="ion-page" id="main-content">

  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>

      <ion-title>Nuclleo</ion-title>

    </ion-toolbar>
  </ion-header>

  <!-- Botoes -->
  <ion-content [fullscreen]="true">

    <div class="acoes-rapidas">

      <ion-button expand="block" class="btn-venda" routerLink="/criar-anuncio/venda">
        Criar anúncio de venda
      </ion-button>

      <ion-button expand="block" fill="outline" class="btn-requerimento" routerLink="/criar-anuncio/requerimento">
        Criar requerimento
      </ion-button>

    </div>

    <div class="section">
      <h2>Sugestões para você</h2>

      <div class="horizontal-scroll">

        <ion-card class="product-card">
          <img src="https://picsum.photos/300/200?1">

          <ion-card-header>
            <ion-card-title>Notebook Gamer</ion-card-title>
            <ion-card-subtitle>R$ 3.500</ion-card-subtitle>
          </ion-card-header>
        </ion-card>

        <ion-card class="product-card">
          <img src="https://picsum.photos/300/200?2">

          <ion-card-header>
            <ion-card-title>Headset RGB</ion-card-title>
            <ion-card-subtitle>R$ 220</ion-card-subtitle>
          </ion-card-header>
        </ion-card>

        <ion-card class="product-card">
          <img src="https://picsum.photos/300/200?3">

          <ion-card-header>
            <ion-card-title>Teclado Mecânico</ion-card-title>
            <ion-card-subtitle>R$ 180</ion-card-subtitle>
          </ion-card-header>
        </ion-card>

      </div>
    </div>

    <div class="section">

      <h2>Comunidades</h2>

      <ion-list>

        <ion-item *ngFor="let comunidade of comunidades">

          <ion-avatar slot="start">
            <img [src]="comunidade.foto || 'https://ionicframework.com/docs/img/demos/avatar.svg'">
          </ion-avatar>

          <ion-label>
            <h3>{{ comunidade.nmComunidade }}</h3>
            <p>{{ comunidade.descricao }}</p>
          </ion-label>

        </ion-item>

      </ion-list>

    </div>

  </ion-content>
</div>
