<div class="ion-page" id="main-content">

  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>

      <ion-title>Nuclleo</ion-title>

    </ion-toolbar>
  </ion-header>

  <ion-content [fullscreen]="true">

    <div class="section">

      <ion-searchbar placeholder="Pesquisar comunidades" [(ngModel)]="pesquisa"
        (ionInput)="aoPesquisar($event)">
      </ion-searchbar>

      <div class="opcao-proximidade">
        <span>Mostrar comunidades próximas</span>
        <ion-toggle [(ngModel)]="buscarPorProximidade" (ionChange)="alterarBuscaProximidade()">
        </ion-toggle>
      </div>

      <!-- CARREGANDO -->
      <div class="loading-state" *ngIf="carregandoComunidades">
        <ion-spinner name="crescent"></ion-spinner>
        <p>Carregando...</p>
      </div>

      <div class="comunidades-grid" *ngIf="!carregandoComunidades">

        <div class="comunidade-card" *ngFor="let comunidade of comunidades"
          [routerLink]="['/comunidade-tela', comunidade.cdComunidade]">

          <img [src]="comunidade.foto || 'assets/img/comunidadePadrao.png'" alt="Foto da Comunidade"
            class="comunidade-foto">

          <div class="comunidade-info">
            <h3 class="titulo-clamp">{{ comunidade.nmComunidade }}</h3>
            <p class="descricao-clamp">{{ comunidade.descricao }}</p>
            <p class="comunidade-local">{{ comunidade.cidade }}, {{ comunidade.uf }}</p>
          </div>
        </div>

      </div>

    </div>

  </ion-content>
</div>
