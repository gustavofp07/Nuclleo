<ion-content [fullscreen]="true" class="editar-content">

  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>

      <ion-title>Alterar perfil</ion-title>

    </ion-toolbar>
  </ion-header>

  <div class="container">

    <!-- TOPO -->
    <div class="topo">

      <ion-button fill="clear" class="btn-voltar" (click)="cancelar()">

        <ion-icon name="chevron-back-outline"></ion-icon>

      </ion-button>

      <h2>Editar perfil</h2>

    </div>

    <!-- FORM -->
    <form (ngSubmit)="salvarAlteracoes()">

      <div class="campo-label">
        <label>Foto de perfil</label>
      </div>

      <div class="upload-box">
        <img *ngIf="previewFoto || usuario.ftUsuario" [src]="previewFoto || usuario.ftUsuario" class="preview-imagem">
        <div *ngIf="!previewFoto && !usuario.ftUsuario" class="placeholder-upload">
          <ion-icon name="image-outline">
          </ion-icon>
          <span>Nenhuma imagem selecionada</span>
        </div>
        <input type="file" hidden #inputFile accept=".png,.jpg,.jpeg" (change)="selecionarImagem($event)">
      </div>

      <ion-button expand="block" type="button" class="btn-upload" (click)="inputFile.click()">Selecionar
        imagem</ion-button>

      <div class="campo-label">
        <label>Nome</label>
      </div>

      <ion-item lines="none" class="input-item">
        <ion-input placeholder="Nome" [(ngModel)]="usuario.nmUsuario" name="nmUsuario">
        </ion-input>
      </ion-item>

      <div class="campo-label">
        <label>E-mail</label>
      </div>

      <ion-item lines="none" class="input-item">
        <ion-input type="email" placeholder="E-mail" [(ngModel)]="usuario.email" name="email">
        </ion-input>
      </ion-item>

      <div class="campo-label">
        <label>CPF</label>
      </div>

      <ion-item lines="none" class="input-item">
        <ion-input placeholder="CPF" [(ngModel)]="usuario.cpf" name="cpf">
        </ion-input>
      </ion-item>

      <div class="campo-label">
        <label>CEP</label>
      </div>

      <ion-item lines="none" class="input-item">
        <ion-input placeholder="CEP" [(ngModel)]="usuario.cep" name="cep">
        </ion-input>
      </ion-item>

      <div class="campo-label">
        <label>Telefone</label>
      </div>

      <ion-item lines="none" class="input-item">
        <ion-input placeholder="Telefone" [(ngModel)]="usuario.telefone" name="telefone">
        </ion-input>
      </ion-item>

      <div class="campo-label">
        <label>Data de Entrada</label>
      </div>

      <ion-item lines="none" class="input-item">
        <ion-input placeholder="Data de Entrada" [value]="usuario.dtEntrada | date: 'dd/MM/yyyy'" name="dtEntrada" readonly>
        </ion-input>
      </ion-item>

      <div class="campo-label">
        <label>Senha</label>
      </div>

      <ion-item lines="none" class="input-item">
        <ion-input [type]="showPassword ? 'text' : 'password'" placeholder="Senha" [(ngModel)]="usuario.senha"
          name="senha" required>
        </ion-input>

        <!-- OLHINHO -->
        <ion-button fill="clear" slot="end" type="button" (click)="togglePassword()">
          <ion-icon slot="icon-only" [name]="showPassword ? 'eye-off-outline' : 'eye-outline'">
          </ion-icon>
        </ion-button>
      </ion-item>

      <!-- BOTÕES -->
      <div class="acoes">
        <ion-button expand="block" class="btn-salvar" type="submit">Salvar alterações</ion-button>
        <ion-button expand="block" fill="outline" class="btn-cancelar" type="button" (click)="cancelar()">Cancelar</ion-button>
      </div>

    </form>

  </div>

</ion-content>
