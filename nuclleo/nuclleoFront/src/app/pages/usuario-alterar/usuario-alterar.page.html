<ion-content [fullscreen]="true" class="editar-content">

  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>

      <ion-title>Alterar perfil</ion-title>

    </ion-toolbar>
  </ion-header>

  <div class="container">

    <!-- TOPO -->
    <div class="topo">

      <ion-button fill="clear" class="btn-voltar" (click)="cancelar()">

        <ion-icon name="chevron-back-outline"></ion-icon>

      </ion-button>

      <h2>Editar perfil</h2>

    </div>

    <!-- FORM -->
    <form (ngSubmit)="confirmarAlteracoes()">

      <!-- FOTO -->
      <div class="foto-box" (click)="selecionarImagem()">

        <div class="foto-circle">
          <img [src]="previewFoto || usuario.ftUsuario || 'assets/img/usuarioPadrao.png'" class="imagem"
            [class.placeholder]="!previewFoto && !usuario.ftUsuario">
        </div>

        <div class="camera-badge">
          <ion-icon name="camera-outline"></ion-icon>
        </div>

      </div>
      <p class="foto-label">Alterar foto</p>

      <!-- NOME -->
      <div class="campo-label">
        <label>Nome</label>
      </div>

      <ion-item lines="none" class="input-item">
        <ion-input placeholder="Nome" [(ngModel)]="usuario.nmUsuario" name="nmUsuario">
        </ion-input>
      </ion-item>

      <!-- CPF -->
      <div class="campo-label">
        <label>CPF</label>
      </div>

      <ion-item lines="none" class="input-item">
        <ion-input placeholder="CPF" [(ngModel)]="usuario.cpf" name="cpf">
        </ion-input>
      </ion-item>

      <!-- CEP -->
      <div class="campo-label">
        <label>CEP</label>
      </div>

      <ion-item lines="none" class="input-item">
        <ion-input placeholder="CEP" [(ngModel)]="usuario.cep" name="cep">
        </ion-input>
      </ion-item>

      <!-- TELEFONE -->
      <div class="campo-label">
        <label>Telefone</label>
      </div>

      <ion-item lines="none" class="input-item">
        <ion-input placeholder="Telefone" [(ngModel)]="usuario.telefone" name="telefone">
        </ion-input>
      </ion-item>
      
      <!-- SENHA -->
<div class="campo-label">
  <label>Senha</label>
</div>

<ion-button expand="block" fill="outline" class="btn-alterar-senha" type="button" (click)="abrirAlterarSenha()">
  Alterar senha
</ion-button>

      <!-- BOTÕES -->
      <div class="acoes">
        <ion-button expand="block" class="btn-salvar" type="submit">Salvar alterações</ion-button>
      </div>

    </form>

  </div>

</ion-content>
