<ion-content [fullscreen]="true" class="cadastro-content">

  <div class="container">

    <!-- TÍTULOS -->
    <div class="copy">
      <h1>Cadastrar</h1>
      <p>Crie sua conta na Nuclleo</p>
    </div>

    <!-- FOTO -->
    <div class="foto-box" (click)="selecionarImagem()">

      <div class="foto-circle">
        <img [src]="previewFoto || usuario.ftUsuario || 'assets/img/usuarioPadrao.png'" class="imagem"
          [class.placeholder]="!previewFoto && !usuario.ftUsuario">
      </div>

      <div class="camera-badge">
        <ion-icon name="camera-outline"></ion-icon>
      </div>

    </div>
    <p class="foto-label">Adicionar foto de perfil</p>

    <!-- FORMULÁRIO -->
    <form (ngSubmit)="salvar()">

      <!-- EMAIL -->
      <div class="campo-label">
        <label>E-mail</label>
      </div>

      <ion-item lines="none" class="input-item">

        <ion-input type="email" placeholder="E-mail" [(ngModel)]="usuario.email" name="email" required>
        </ion-input>

      </ion-item>

      <!-- NOME -->
      <div class="campo-label">
        <label>Nome</label>
      </div>
      <ion-item lines="none" class="input-item">

        <ion-input placeholder="Nome" [(ngModel)]="usuario.nmUsuario" name="nmUsuario" required>
        </ion-input>

      </ion-item>

      <!-- SENHA -->
      <div class="campo-label">
        <label>Senha</label>
      </div>
      <ion-item lines="none" class="input-item">

        <ion-input [type]="showPassword ? 'text' : 'password'" placeholder="Senha" [(ngModel)]="usuario.senha"
          name="senha" required>
        </ion-input>

        <ion-button fill="clear" slot="end" type="button" (click)="togglePassword()">

          <ion-icon slot="icon-only" [name]="showPassword ? 'eye-off-outline' : 'eye-outline'">
          </ion-icon>

        </ion-button>

      </ion-item>

      <!-- CONFIRMAR SENHA -->
      <div class="campo-label">
        <label>Confirmar senha</label>
      </div>
      <ion-item lines="none" class="input-item">

        <ion-input [type]="showConfirmPassword ? 'text' : 'password'" placeholder="Confirmar senha"
          [(ngModel)]="confirmarSenha" name="confirmarSenha" required>
        </ion-input>

        <ion-button fill="clear" slot="end" type="button" (click)="toggleConfirmPassword()">

          <ion-icon slot="icon-only" [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'">
          </ion-icon>

        </ion-button>

      </ion-item>

      <!-- BOTÃO -->
      <ion-button expand="block" type="submit" class="btn-cadastrar">
        Cadastrar
      </ion-button>

    </form>

    <!-- TERMOS -->
    <p class="termos">

      Ao clicar em continuar, você concorda com os nossos
      <span>Termos de Serviço</span> e com a
      <span>Política de Privacidade</span>

    </p>

  </div>

</ion-content>
