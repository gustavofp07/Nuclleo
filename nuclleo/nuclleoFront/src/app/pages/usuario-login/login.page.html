<ion-content [fullscreen]="true" class="login-content">

  <div class="container">

    <!-- Logo / Nome -->
    <div class="brand">

      <img src="assets/img/logo.png" alt="Logo Nuclleo" class="logo">

    </div>

    <!-- Títulos -->
    <div class="copy">
      <h1>Login</h1>
      <p>Insira seu e-mail e senha</p>
    </div>

    <!-- Formulário -->
    <form [formGroup]="formLogin" (ngSubmit)="entrar()">

      <!-- Email -->
      <div class="campo-label">
        <label>E-mail</label>
      </div>
      <ion-item lines="none" class="input-item">
        <ion-input type="email" placeholder="E-mail" formControlName="email">
        </ion-input>
      </ion-item>

      <p class="mensagem-erro" *ngIf="
        formLogin.get('email')?.touched &&
        formLogin.get('email')?.hasError('required')">
        Informe o e-mail.
      </p>

      <p class="mensagem-erro" *ngIf="formLogin.get('email')?.touched &&(
        formLogin.get('email')?.hasError('email') ||
        formLogin.get('email')?.hasError('pattern'))">
        Informe um e-mail válido.
      </p>

      <!-- Senha -->
      <div class="campo-label">
        <label>Senha</label>
      </div>
      <ion-item lines="none" class="input-item">

        <ion-input [type]="showPassword ? 'text' : 'password'" placeholder="Senha" formControlName="senha">
        </ion-input>

        <!-- OLHINHO -->
        <ion-button fill="clear" slot="end" type="button" (click)="togglePassword()">
          <ion-icon slot="icon-only" [name]="showPassword ? 'eye-off-outline' : 'eye-outline'">
          </ion-icon>
        </ion-button>

      </ion-item>

      <p class="mensagem-erro" *ngIf="
        formLogin.get('senha')?.touched &&
        formLogin.get('senha')?.hasError('required')">
        Informe a senha.
      </p>

      <!-- Botão Login -->
      <ion-button expand="block" type="submit" class="btn-login" [disabled]="formLogin.invalid">
        Entrar
      </ion-button>

    </form>

    <!-- Divider -->
    <div class="divider">

      <div class="divider-line"></div>

      <span>ou</span>

      <div class="divider-line"></div>

    </div>

    <!-- Cadastro -->
    <a routerLink="/usuario-cadastro" class="register-link">Não possuo uma conta</a>

  </div>

</ion-content>
