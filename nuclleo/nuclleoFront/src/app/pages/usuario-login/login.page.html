<ion-content [fullscreen]="true" class="login-content">

  <div class="container">

    <!-- Logo / Nome -->
    <div class="brand">

      <img src="assets/img/logo.png" alt="Logo Nuclleo" class="logo">

    </div>

    <!-- Títulos -->
    <div class="copy">
      <h1>Login</h1>
      <p>Insira seu e-mail e senha</p>
    </div>

    <!-- Formulário -->
    <form (ngSubmit)="entrar()">

      <!-- Email -->
      <div class="campo-label">
        <label>E-mail</label>
      </div>
      <ion-item lines="none" class="input-item">

        <ion-input type="email" placeholder="E-mail" [(ngModel)]="login.email" name="email" required>
        </ion-input>

      </ion-item>

      <!-- Senha -->
      <div class="campo-label">
        <label>Senha</label>
      </div>
      <ion-item lines="none" class="input-item">

        <ion-input [type]="showPassword ? 'text' : 'password'" placeholder="Senha" [(ngModel)]="login.senha"
          name="password" required>
        </ion-input>

        <!-- OLHINHO -->
        <ion-button fill="clear" slot="end" type="button" (click)="togglePassword()">

          <ion-icon slot="icon-only" [name]="showPassword ? 'eye-off-outline' : 'eye-outline'">
          </ion-icon>

        </ion-button>

      </ion-item>

      <!-- Botão Login -->
      <ion-button expand="block" type="submit" class="btn-login">Entrar</ion-button>

    </form>

    <!-- Divider -->
    <div class="divider">

      <div class="divider-line"></div>

      <span>ou</span>

      <div class="divider-line"></div>

    </div>

    <!-- Cadastro -->
    <a routerLink="/usuario-cadastro" class="register-link">Não possuo uma conta</a>

  </div>

</ion-content>
